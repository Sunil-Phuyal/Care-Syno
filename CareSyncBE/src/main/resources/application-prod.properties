# ===== Production profile (committed, no secrets) =====
# Real values come from environment variables set on the host.

# Small pool that can shrink to zero idle connections, so a serverless database
# can suspend. Idle connections are retired after 1 minute.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:60000}

spring.jpa.show-sql=false

# Frontend origin(s) allowed to call the API, comma separated, no trailing slash
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Host runs the app behind a proxy
server.forward-headers-strategy=framework

# Finish in-flight requests when the host sends SIGTERM
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Fewer request threads means less memory on a 512 MB host
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
