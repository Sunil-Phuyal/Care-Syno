spring.application.name=CareSync
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:9878}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

imagekit.private.key=${IMAGEKIT_PRIVATE_KEY}
imagekit.public.key=${IMAGEKIT_PUBLIC_KEY}
imagekit.url.endpoint=${IMAGEKIT_URL_ENDPOINT}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
jwt.encryption.key=${JWT_ENCRYPTION_KEY}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
email.from=${EMAIL_FROM}
email.from.name=${EMAIL_FROM_NAME}

app.frontend.url=${APP_FRONTEND_URL}
app.backend.url=${APP_BACKEND_URL}
reset-link.invite-base-url=${RESET_LINK_INVITE_BASE_URL}
reset-link.forgot-password-base-url=${RESET_LINK_FORGOT_BASE_URL}
reset-link.expiration-time=${RESET_LINK_EXPIRATION_TIME}

spring.jpa.open-in-view=false
spring.thymeleaf.check-template-location=false
