spring.application.name=care-sync
spring.profiles.active=dev


# ============================================================
# SCHEMA INITIALIZATION (MODULAR)
# ============================================================
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Execute schema files in order
spring.sql.init.schema-locations=\
  classpath:db/schema/01_auth_schema.sql,\
  classpath:db/schema/02_onboarding_schema.sql,\
  classpath:db/schema/03_patient_schema.sql,\
  classpath:db/schema/04_medication_schema.sql

# Execute seed data
spring.sql.init.data-locations=classpath:db/data/01_auth_seed.sql