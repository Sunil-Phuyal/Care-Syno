<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apply saved theme before first paint (no flash). Default is light.
         Dark only if the user saved 'dark', or saved 'system' and the OS is dark. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('caresync-theme-v2');
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <title>CareSyno | Shared caregiving for families</title>
    <meta
      name="description"
      content="CareSyno helps families look after elderly or dependent relatives: medicine schedules, caregivers and adherence reports in one place."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0D9488" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap"
      rel="stylesheet"
    />

    <!-- Link preview card: LinkedIn, WhatsApp, Facebook and similar -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CareSyno" />
    <meta property="og:title" content="CareSyno | Shared caregiving for families" />
    <meta
      property="og:description"
      content="Keep medicine times, given doses and caregiver access in one place."
    />
    <meta property="og:url" content="https://care-syno.vercel.app/" />
    <meta property="og:image" content="https://care-syno.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CareSyno logo with the text: Everyone who helps care for them, on the same schedule" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CareSyno | Shared caregiving for families" />
    <meta
      name="twitter:description"
      content="Keep medicine times, given doses and caregiver access in one place."
    />
    <meta name="twitter:image" content="https://care-syno.vercel.app/og-image.png" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="FF9icFFUl80rslUbXgoujaukB5y7xjQ8GI9K8NTja_k" />

    <!-- Tells search engines the site's name. "CareSync" is the earlier spelling. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CareSyno",
        "alternateName": ["CareSync", "Care Syno"],
        "url": "https://care-syno.vercel.app/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>CareSyno</h1>
      <p>
        CareSyno is a shared caregiving app that helps families look after elderly or dependent relatives:
        medicine schedules, reminder emails, caregiver invitations with permissions, dose records and
        adherence reports.
      </p>
      <p>Please enable JavaScript to use the app.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
